name: alphaprofit-dynamic-slot-c

on:
  push:
    paths:
      - 'alphaodds/build/alphaprofit_dynamic_slot_c_gate.py'
      - '.github/workflows/alphaprofit-dynamic-slot-c.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dynamic-slot-c:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.1.1 pandas==2.2.3
      - name: Execute Dynamic Slot C gate
        run: |
          python alphaodds/build/alphaprofit_dynamic_slot_c_gate.py 2>&1 | tee alphaprofit_dynamic_slot_c_gate.log
      - name: Capture runtime receipt
        run: |
          python --version > alphaprofit_dynamic_slot_c_environment.txt
          python -m pip freeze >> alphaprofit_dynamic_slot_c_environment.txt
          echo "commit=$GITHUB_SHA" >> alphaprofit_dynamic_slot_c_environment.txt
      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: alphaprofit-dynamic-slot-c
          path: |
            alphaprofit_dynamic_c_runtime/out/**
            alphaprofit_dynamic_slot_c_gate.log
            alphaprofit_dynamic_slot_c_environment.txt
          if-no-files-found: error
          retention-days: 30
