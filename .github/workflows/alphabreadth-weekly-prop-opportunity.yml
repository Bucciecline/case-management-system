name: alphabreadth-weekly-prop-opportunity

on:
  push:
    paths:
      - 'alphaodds/build/alphabreadth_weekly_prop_opportunity_gate.py'
      - '.github/workflows/alphabreadth-weekly-prop-opportunity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weekly-prop-opportunity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.1.1 pandas==2.2.3 scikit-learn==1.5.2
      - name: Execute weekly prop opportunity gate
        shell: bash
        run: |
          set -o pipefail
          python alphaodds/build/alphabreadth_weekly_prop_opportunity_gate.py 2>&1 | tee alphabreadth_weekly_prop.log
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: alphabreadth-weekly-prop-opportunity
          path: |
            alphabreadth_prop_runtime/out/**
            alphabreadth_weekly_prop.log
          if-no-files-found: error
          retention-days: 30
