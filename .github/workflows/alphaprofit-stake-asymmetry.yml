name: alphaprofit-stake-asymmetry

on:
  push:
    paths:
      - 'alphaodds/build/alphaprofit_stake_asymmetry_gate.py'
      - '.github/workflows/alphaprofit-stake-asymmetry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stake-asymmetry:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.1.1 pandas==2.2.3
      - name: Execute stake-asymmetry gate
        run: |
          python alphaodds/build/alphaprofit_stake_asymmetry_gate.py 2>&1 | tee alphaprofit_stake_asymmetry_gate.log
      - name: Capture runtime receipt
        run: |
          python --version > alphaprofit_stake_asymmetry_environment.txt
          python -m pip freeze >> alphaprofit_stake_asymmetry_environment.txt
          echo "commit=$GITHUB_SHA" >> alphaprofit_stake_asymmetry_environment.txt
      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: alphaprofit-stake-asymmetry
          path: |
            alphaprofit_stake_runtime/out/**
            alphaprofit_stake_asymmetry_gate.log
            alphaprofit_stake_asymmetry_environment.txt
          if-no-files-found: error
          retention-days: 30
