name: alphabreadth-week4-side-total-upgrade

on:
  push:
    paths:
      - 'alphaodds/build/alphabreadth_week4_side_total_matchup_upgrade.py'
      - '.github/workflows/alphabreadth-week4-side-total-upgrade.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  side-total-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.1.1 pandas==2.2.3 scikit-learn==1.5.2
      - name: Execute matchup-aware side/total gate
        shell: bash
        run: |
          set -o pipefail
          python alphaodds/build/alphabreadth_week4_side_total_matchup_upgrade.py 2>&1 | tee alphabreadth_week4_side_total_upgrade.log
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: alphabreadth-week4-side-total-upgrade
          path: |
            alphabreadth_matchup_upgrade_runtime/out/**
            alphabreadth_week4_side_total_upgrade.log
          if-no-files-found: error
          retention-days: 30
