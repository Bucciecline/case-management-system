name: winner-dna-resilience-temporal

on:
  push:
    paths:
      - 'alphaodds/winner_dna/resilience_temporal_gate.py'
      - '.github/workflows/winner-dna-resilience-temporal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resilience-temporal:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.1.1 pandas==2.2.3
      - name: Run temporal resilience gate
        run: |
          python alphaodds/winner_dna/resilience_temporal_gate.py 2>&1 | tee resilience_temporal.log
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: winner-dna-resilience-temporal-2026-09-26
          path: |
            alphaodds/winner_dna/outputs/resilience_temporal/**
            resilience_temporal.log
          if-no-files-found: error
          retention-days: 30
