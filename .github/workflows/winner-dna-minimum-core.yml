name: winner-dna-minimum-core

on:
  push:
    paths:
      - 'alphaodds/winner_dna/minimum_core_gate.py'
      - '.github/workflows/winner-dna-minimum-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minimum-core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.1.1 pandas==2.2.3
      - name: Run minimum-core gate
        run: |
          set -o pipefail
          python alphaodds/winner_dna/minimum_core_gate.py 2>&1 | tee minimum_core.log
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: winner-dna-minimum-core-2026-09-26
          path: |
            alphaodds/winner_dna/outputs/minimum_core/**
            minimum_core.log
          if-no-files-found: error
          retention-days: 30
