name: alphabreadth-side-total-baseline

on:
  push:
    paths:
      - 'alphaodds/build/alphabreadth_side_total_baseline.py'
      - '.github/workflows/alphabreadth-side-total-baseline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  side-total-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.1.1 pandas==2.2.3 scikit-learn==1.5.2
      - name: Execute AlphaBreadth side and total baseline
        run: |
          python alphaodds/build/alphabreadth_side_total_baseline.py 2>&1 | tee alphabreadth_side_total.log
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: alphabreadth-side-total-baseline
          path: |
            alphabreadth_side_total_runtime/out/**
            alphabreadth_side_total.log
          if-no-files-found: error
          retention-days: 30
